name: Desktop builds

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-exe:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm skyrim_save_lab.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimSaveLab-Windows
          path: dist/SkyrimSaveLab.exe
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Linux AppImage
        run: ./packaging/appimage/build-appimage.sh

      - name: Smoke-test AppImage
        shell: bash
        run: |
          artifact="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          set +e
          timeout 5 env QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "$artifact"
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimSaveLab-Linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
